                <p class="text-xs text-slate-500 mt-1">โรงเรียนวัดไร่ขิงวิทยา | ครูสุรเดช ธรรมประโชติ</p>

    <script>
        let CURRENT_USER = null;
        window.__AUTH_READY_STATE = 'pending';
        const SESSION_KEY = 'wrk_school_session'; // Define session key

        // Do not initialize the app before the Firebase bridge and Auth
        // persistence are ready. Otherwise a restored teacher session can be
        // mistaken for an anonymous user and all reads/writes appear denied.
        window.onload = function() {
            waitForBackendReady();
        };

        function waitForBackendReady(attempt = 0) {
            const bridgeReady = !!(window.google && google.script && google.script.run);
            const firebaseReady = !!(window.firebase && firebase.auth);
            const supabaseReady = !!(window.__SUPABASE_MODE__ && window.__SUPABASE_CLIENT__);
            // GitHub/Supabase builds do not load the legacy Apps Script bridge.
            // Waiting for google.script here made a valid OAuth callback time out
            // and incorrectly return to the login screen.
            if ((bridgeReady || supabaseReady) && firebaseReady) {
                if (!window.__authBootstrapPromise) {
                    window.__authBootstrapPromise = new Promise((resolve) => {
                        let settled = false;
                        let unsubscribe = null;
                        const finish = (user) => {
                            if (settled) return;
                            settled = true;
                            if (unsubscribe) unsubscribe();
                            resolve(user || null);
                        };
                        const timeout = setTimeout(() => finish(firebase.auth().currentUser), 8000);
                        unsubscribe = firebase.auth().onAuthStateChanged((user) => {
                            clearTimeout(timeout);
                            finish(user);
                        });
                    });
                }
                window.__authBootstrapPromise.then(async (user) => {
                    // Supabase may finish processing the OAuth callback just
                    // after the initial auth-state callback reports null.
                    // Give its URL/session handler a short settling window
                    // before deciding that the staff user is unauthenticated.
                    if (!user && window.__SUPABASE_MODE__) {
                        await new Promise(resolve => setTimeout(resolve, 1500));
                        user = (window.firebase && window.firebase.auth) ? window.firebase.auth().currentUser : null;
                    }
                    window.__FIREBASE_AUTH_USER = user || null;
                    window.__AUTH_READY_STATE = user ? (user.isAnonymous ? 'anonymous' : 'authenticated') : 'missing';
                    checkSession();
                });
                return;
            }
            if (attempt >= 40) {
                setLoading(false);
                const message = !bridgeReady
                    ? 'ระบบเชื่อมต่อฐานข้อมูลไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วโหลดหน้าใหม่'
                    : 'ระบบกำลังยืนยันบัญชีผู้ใช้ กรุณาโหลดหน้าใหม่อีกครั้ง';
                if (typeof showLogin === 'function') showLogin();
                if (typeof Swal !== 'undefined') Swal.fire({ icon: 'error', title: 'เปิดระบบไม่สมบูรณ์', text: message, confirmButtonText: 'ตกลง' });
                return;
            }
            setTimeout(() => waitForBackendReady(attempt + 1), 250);
        }

        // --- A) Helper Functions (Session Isolation) ---
        
        function saveSession(userObj) {
            if (!userObj) return;
            // รูป Base64 อาจมีขนาดใหญ่กว่าพื้นที่ของ sessionStorage จึงไม่เก็บรูปไว้ใน session
            const sessionUser = { ...userObj };
            if (typeof sessionUser.imageUrl === 'string' && sessionUser.imageUrl.startsWith('data:image/')) delete sessionUser.imageUrl;
            delete sessionUser.password;
            delete sessionUser.authUser;
            try {
                sessionStorage.setItem(SESSION_KEY, JSON.stringify(sessionUser));
            } catch (e) {
                sessionStorage.removeItem(SESSION_KEY);
                sessionStorage.setItem(SESSION_KEY, JSON.stringify({ id: sessionUser.id, username: sessionUser.username, name: sessionUser.name, role: sessionUser.role, status: sessionUser.status }));
            }
            // ลบ localStorage เดิมทิ้ง เพื่อไม่ให้ข้อมูลค้างข้าม Tab หรือหลังปิดเครื่อง
            localStorage.removeItem(SESSION_KEY);
        }

        function loadSession() {
            try {
                // อ่านจาก sessionStorage เท่านั้น
                const data = sessionStorage.getItem(SESSION_KEY);
                return data ? JSON.parse(data) : null;
            } catch (e) {
                console.error("Session Parse Error", e);
                return null;
            }
        }

        function clearSession() {
            // ล้างทั้งสองที่เพื่อให้มั่นใจว่าสะอาด
            sessionStorage.removeItem(SESSION_KEY);
            localStorage.removeItem(SESSION_KEY);
        }

        // --- B) Check Session (Updated) ---
        function checkSession() {
            const localUser = loadSession(); // ใช้ Helper ใหม่

            // กันเหนียว: ถ้ามี localStorage ค้างมาจากระบบเก่า ให้ลบทิ้ง
            if (localStorage.getItem(SESSION_KEY)) {
                localStorage.removeItem(SESSION_KEY);
            }

            if (localUser && localUser.id) {
                // Staff sessions must always be backed by the current Google account.
                // A sessionStorage record alone must never reopen a teacher/admin screen,
                // because it can belong to another Chrome profile or another email.
                const localRole = String(localUser.role || '').toLowerCase();
                const staffRole = ['admin', 'teacher'].includes(localRole);
                const firebaseUser = (window.firebase && firebase.auth) ? firebase.auth().currentUser : null;
                const authEmail = String(firebaseUser && firebaseUser.email || '').trim().toLowerCase();
                const savedEmail = String(localUser.email || localUser.Email || '').trim().toLowerCase();
                const adminEmail = 'suradet.t@wrk.ac.th';
                const emailMismatch = staffRole && firebaseUser && (
                    (localRole === 'admin' && authEmail !== adminEmail) ||
                    (localRole !== 'admin' && savedEmail && savedEmail !== authEmail)
                );
                if (staffRole && (!firebaseUser || firebaseUser.isAnonymous || emailMismatch)) {
                    clearSession();
                    setLoading(false);
                    showLogin();
                    Swal.fire('ต้องเข้าสู่ระบบด้วย Google', emailMismatch ? 'บัญชี Google ไม่ตรงกับอีเมลที่ผูกไว้ ระบบจึงไม่ใช้ข้อมูลค้างของบัญชีเดิม' : 'บัญชีครู/แอดมินต้องยืนยันด้วย Google เพื่อแยกสิทธิ์ตามอีเมลจริง', 'warning');
                    return;
                }
                // มี Session -> ตรวจสอบกับ Server
                setLoading(true, 'กำลังยืนยันข้อมูลผู้ใช้...');
                
                if (google.script.run.getCurrentUserProfile) {
                    google.script.run
                        .withSuccessHandler((serverUser) => {
                            setLoading(false);
                            const normalizedUser = (serverUser && serverUser.success && serverUser.data) ? serverUser.data : serverUser;
                            if (normalizedUser && normalizedUser.id) {
                                CURRENT_USER = { ...localUser, ...normalizedUser };
                                // อัปเดตลง SessionStorage
                                saveSession(CURRENT_USER);
                            } else {
                                console.warn("Sync returned empty; refusing to reopen a staff session without server confirmation.");
                                clearSession();
                                showLogin();
                                return;
                            }
                            renderAppByRole();
                        })
                        .withFailureHandler((err) => {
                            setLoading(false);
                            console.warn("Sync failed; refusing to reopen a staff session:", err);
                            clearSession();
                            showLogin();
                        })
                        .getCurrentUserProfile(localUser.id);
                } else {
                    setLoading(false);
                    clearSession();
                    showLogin();
                }
            } else {
                // Supabase OAuth may have just completed and established an
                // auth session before the app sessionStorage record exists.
                // Resolve that session once so the callback can enter the
                // same staff flow without requiring a second login click.
                const callbackUser = window.__SUPABASE_MODE__ && window.__FIREBASE_AUTH_USER;
                const supabaseSessionReady = window.__SUPABASE_MODE__ && window.__SUPABASE_SESSION_READY__;
                if ((callbackUser && !callbackUser.isAnonymous || supabaseSessionReady) && typeof window.firebaseSignInWithGoogle === 'function') {
                    setLoading(true, 'กำลังยืนยันบัญชี Google...');
                    window.firebaseSignInWithGoogle().then((result) => {
                        if (result && result.success && result.user) {
                            CURRENT_USER = result.user;
                            saveSession(CURRENT_USER);
                            renderAppByRole();
                        } else {
                            setLoading(false);
                            showLogin();
                        }
                    }).catch((error) => {
                        console.warn('SUPABASE_OAUTH_CALLBACK_FAILED', error);
                        setLoading(false);
                        showLogin();
                    });
                } else {
                    // ไม่มี Session -> ไปหน้า Login
                    showLogin();
                }
            }
        }

        function showLogin() {
            const el = document.getElementById('page-login');
            if(el) el.classList.remove('hidden');
        }

        async function handleAdminGoogleLogin() {
            try {
                setLoading(true, 'กำลังตรวจสอบบัญชี Google...');
                const result = await window.firebaseSignInWithGoogle();
                if (result && result.redirecting) return;
                setLoading(false);
                if (result.needsSetup) {
                    // Do not leave an unapproved Google identity authenticated
                    // after the staff gate rejects it. A later reload must not
                    // inherit that identity as a valid staff session.
                    try { await firebase.auth().signOut(); } catch (signOutError) { console.warn('Unauthorized Google sign-out failed', signOutError); }
                    Swal.fire('ยังไม่มีสิทธิ์ใช้งาน', `อีเมล ${result.email || ''} ยังไม่ได้เพิ่มโดยผู้ดูแลระบบ กรุณาให้แอดมินเพิ่มอีเมลนี้ใน Users ก่อน`, 'error');
                    return;
                }
                CURRENT_USER = result.user;
                saveSession(CURRENT_USER);
                    renderAppByRole();
            } catch (error) {
                setLoading(false);
                const code = String(error?.code || '');
                if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
                    Swal.fire(
                        'หน้าต่าง Google ถูกปิด',
                        'หน้าต่างยืนยันตัวตนถูกปิดก่อนเสร็จสิ้น หากกำลังทดสอบบนเครื่องนี้ ให้ใช้ Local Test Browser; หากใช้ระบบจริง ให้เปิดผ่าน HTTPS และอนุญาต popup ของ Google',
                        'warning'
                    );
                } else if (code === 'auth/popup-blocked') {
                    Swal.fire(
                        'เบราว์เซอร์บล็อกหน้าต่าง Google',
                        'อนุญาต popup สำหรับเว็บไซต์นี้แล้วลองใหม่ หรือใช้ Local Test Browser สำหรับการทดสอบโดยไม่เชื่อม Firebase จริง',
                        'warning'
                    );
                } else {
                    Swal.fire('เข้าสู่ระบบไม่สำเร็จ', String(error.message || error), 'error');
                }
            }
        }

        async function showTeacherSetupModal(authResult) {
            const options = await new Promise((resolve, reject) => {
                google.script.run.withSuccessHandler(r => r && r.success ? resolve(r.data) : reject(new Error(r?.message || 'โหลดรายการตั้งค่าไม่สำเร็จ'))).withFailureHandler(reject).getTeacherSetupOptions();
            });
            const esc = value => String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
            const comboOptions = (options.combos || []).map(c => `<option value="${esc(c.key)}" data-subject="${esc(c.subjectCode)}" data-level="${esc(c.level)}" data-room="${esc(c.room)}">${esc(c.subjectCode)} ${esc(c.subjectName)} — ${esc(c.level)} / ห้อง ${esc(c.room)}</option>`).join('');
            const result = await Swal.fire({ title: 'ตั้งค่าสิทธิ์ครูครั้งแรก', html: `<p class="text-left text-sm mb-3">อีเมล <b>${esc(authResult.email)}</b> ให้เลือกจากชุดวิชา–ชั้น–ห้องที่ตั้งค่าไว้แล้ว</p><select id="setup-combo" class="swal2-select"><option value="">เลือกชุดวิชา–ชั้น–ห้อง</option>${comboOptions}</select>`, showCancelButton: true, confirmButtonText: 'ส่งคำขอ', cancelButtonText: 'ยกเลิก', preConfirm: () => { const option = document.getElementById('setup-combo').selectedOptions[0]; if (!option || !option.dataset.subject) { Swal.showValidationMessage('กรุณาเลือกชุดวิชา–ชั้น–ห้อง'); return false; } return { subjectCode: option.dataset.subject, level: option.dataset.level, room: option.dataset.room }; } });
            if (!result.isConfirmed) { await firebase.auth().signOut(); return; }
            try { const saved = await new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).submitTeacherAccessRequest(result.value)); if (!saved?.success) throw new Error(saved?.message || 'ส่งคำขอไม่สำเร็จ'); await firebase.auth().signOut(); await Swal.fire('ส่งคำขอแล้ว', saved.message, 'success'); } catch (error) { await firebase.auth().signOut(); await Swal.fire('ส่งคำขอไม่สำเร็จ', String(error.message || error), 'error'); }
        }

        // 3. Render หน้าจอตามสิทธิ์ (FIXED FOR TEACHER ROLE)
        function renderAppByRole() {
            const role = String(CURRENT_USER && CURRENT_USER.role || '').toLowerCase();
            const firebaseUser = (window.firebase && firebase.auth) ? firebase.auth().currentUser : null;
            const firebaseEmail = String(firebaseUser && firebaseUser.email || '').trim().toLowerCase();
            const expectedEmail = String(CURRENT_USER && (CURRENT_USER.email || CURRENT_USER.Email) || '').trim().toLowerCase();
            const identityOk = ['admin', 'teacher'].includes(role) && (
                firebaseUser && !firebaseUser.isAnonymous && ((role === 'admin' && firebaseEmail === 'suradet.t@wrk.ac.th') || (role !== 'admin' && expectedEmail === firebaseEmail))
            );
            if (!identityOk) {
                clearSession();
                CURRENT_USER = null;
                showLogin();
                setLoading(false);
                console.warn('STAFF_RENDER_BLOCKED: no matching Google Auth identity.');
                return;
            }
            window.__AUTH_READY_STATE = 'verified';
            const loginPage = document.getElementById('page-login');
            const appPage = document.getElementById('page-app');
            const adminContainer = document.getElementById('container-admin');
            if(loginPage) loginPage.classList.add('hidden');
            if(appPage) appPage.classList.remove('hidden');
            
            if (CURRENT_USER.role === 'admin' || CURRENT_USER.role === 'teacher') {
                if(adminContainer) adminContainer.classList.remove('hidden');
                const initKey = [CURRENT_USER.id || '', CURRENT_USER.role || '', window.CURRENT_SERVER_TERM || ''].join('_');
                if (window.__ADMIN_INIT_DONE_FOR_USER_TERM !== initKey) {
                    window.__ADMIN_INIT_DONE_FOR_USER_TERM = initKey;
                    if(typeof initAdminDashboard === 'function') initAdminDashboard();
                }
            } else {
                clearSession();
                CURRENT_USER = null;
                if(adminContainer) adminContainer.classList.add('hidden');
                if(appPage) appPage.classList.add('hidden');
                showLogin();
                setLoading(false);
                Swal.fire('ไม่มีสิทธิ์ใช้งาน', 'ระบบนี้เปิดให้เฉพาะครูและผู้ดูแลระบบเท่านั้น', 'error');
            }
        }

        // 4. Logout (Updated)
        function logout() {
            Swal.fire({
                title: 'ออกจากระบบ?',
                text: "คุณต้องการออกจากระบบใช่หรือไม่",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#1e3a8a',
                cancelButtonColor: '#d33',
                confirmButtonText: 'ใช่, ออกจากระบบ',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    resetToLogin();
                }
            });
        }

        // --- D) Reset To Login (Updated) ---
        async function resetToLogin() {
            // [CHANGE] ใช้ clearSession แทน localStorage.removeItem
            clearSession();

            // Clear the provider session as well as the app session. Otherwise
            // Firebase can keep the previous Google identity authenticated
            // after logout, which makes a later write/read look like a stale
            // staff session even though the UI returned to the login screen.
            try {
                if (window.firebase && firebase.auth && firebase.auth().currentUser) await firebase.auth().signOut();
            } catch (error) {
                console.warn('Firebase sign-out failed during logout', error);
            }
            
            CURRENT_USER = null;
            window.__AUTH_READY_STATE = 'missing';
            window.__ADMIN_INIT_DONE_FOR_USER_TERM = '';

            const appPage = document.getElementById('page-app');
            if(appPage) appPage.classList.add('hidden');
            
            const adminContainer = document.getElementById('container-admin');
            if(adminContainer) adminContainer.classList.add('hidden');
            
            const loginPage = document.getElementById('page-login');
            if(loginPage) loginPage.classList.remove('hidden');

            setLoading(false);
        }

        function setLoading(show, text = 'กำลังประมวลผล...') {
            const el = document.getElementById('loading-overlay');
            const txt = document.getElementById('loading-text');
            if(show) {
                if(txt) txt.innerText = text;
                if(el) el.classList.remove('hidden');
            } else {
                if(el) el.classList.add('hidden');
            }
        }
    </script>
