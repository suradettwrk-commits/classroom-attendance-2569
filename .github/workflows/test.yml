name: Test and build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/repository-safety-check.js
      - run: node --check firebase-bridge.js
      - run: node --check supabase-auth-client.js
      - run: node --check supabase-score-client.js
      - run: node build-github-pages.js
      - run: git diff --exit-code -- docs/index.html docs/firebase-bridge.js docs/supabase-auth-client.js docs/supabase-score-client.js
