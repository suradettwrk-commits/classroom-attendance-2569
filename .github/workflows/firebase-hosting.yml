name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact GitHub commit
        uses: actions/checkout@v4
      - name: Build static Firebase client
        run: node build-github-pages.js
      - name: Deploy docs to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLASSROOM_ATTENDANCE_2569 }}'
          projectId: classroom-attendance-2569
          channelId: live
